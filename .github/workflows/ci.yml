name: CI

# Validation only: the version scheme's own logic. Building and testing on each platform is in the
# per-platform workflows (tests-<rid>.yml through platform-tests.yml; build-<rid>.yml through
# platform-package.yml), so each platform has a status badge of its own. Nothing here tags, releases
# or publishes anything.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-scheme:
    name: Version scheme logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test X.Y parsing and increment
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
