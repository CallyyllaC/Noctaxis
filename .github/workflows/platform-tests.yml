name: Build and test (reusable)

# Builds the solution and runs the Core and Desktop test suites on one hosted runner, after confirming the
# runner's operating system and processor. Called by ci.yml (ordinary development) and release.yml (before a
# release is published). Validation only: nothing is packaged, tagged, released or published.
on:
  workflow_call:
    inputs:
      runner:
        description: Hosted runner label.
        required: true
        type: string
      rid:
        description: Runtime identifier the runner and its .NET SDK must natively be.
        required: true
        type: string
      sha:
        description: Commit to test (default the commit that triggered the run).
        required: false
        type: string
        default: ''
      build-number:
        description: Z of X.Y.Z (default the calling workflow's run number).
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-and-test:
    name: Tests (${{ inputs.rid }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Directory.Build.targets also sets this for Avalonia's build task.
      AVALONIA_TELEMETRY_OPTOUT: 1
      # Z of X.Y.Z (Directory.Build.props). MSBuild reads environment variables as properties, so restore,
      # build and the version check below all see the same value. run_number is kept on re-runs.
      NoctaxisBuildNumber: ${{ inputs.build-number || github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Confirm the runner's operating system and processor
        shell: bash
        run: bash scripts/check-runner-platform.sh ${{ inputs.rid }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ inputs.rid }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ inputs.rid }}-

      - name: Restore
        run: dotnet restore Noctaxis.slnx

      - name: Resolve and verify version
        shell: bash
        run: |
          set -euo pipefail
          project=Noctaxis.Core/Noctaxis.Core.csproj
          xy=$(dotnet msbuild "$project" -getProperty:NoctaxisVersion | tr -d '\r')
          local_version=$(env -u NoctaxisBuildNumber dotnet msbuild "$project" -getProperty:Version | tr -d '\r')
          ci_version=$(dotnet msbuild "$project" -getProperty:Version | tr -d '\r')
          if [ "$local_version" != "$xy.0" ]; then
            echo "::error::Local fallback version is '$local_version', expected '$xy.0'."; exit 1
          fi
          if [ "$ci_version" != "$xy.$NoctaxisBuildNumber" ]; then
            echo "::error::CI version is '$ci_version', expected '$xy.$NoctaxisBuildNumber'."; exit 1
          fi
          echo "NOCTAXIS_EXPECTED_VERSION=$ci_version" >> "$GITHUB_ENV"
          echo "Noctaxis version: \`$ci_version\` (${{ inputs.rid }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        run: dotnet build Noctaxis.slnx --configuration Release --no-restore

      # Tests run with --no-build against the assemblies built above, and VersionMetadataTests checks them
      # against NOCTAXIS_EXPECTED_VERSION. Network-backed tests are opt-in through NOCTAXIS_RUN_* variables and
      # skip by default; the LiveTerrain category is excluded as well, so CI never depends on tile services.
      - name: Test Noctaxis.Core.Tests
        run: >-
          dotnet test Noctaxis.Core.Tests/Noctaxis.Core.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=LiveTerrain"
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults

      - name: Test Noctaxis.Desktop.Tests
        # Run even when Core tests fail, but only against a successful build.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test Noctaxis.Desktop.Tests/Noctaxis.Desktop.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=LiveTerrain"
          --logger "trx;LogFileName=desktop-tests.trx"
          --results-directory TestResults

      - name: Keep the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ inputs.rid }}
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: warn
