name: Package

# Builds the release packages on their own platforms, checks them, starts each one and keeps them. It runs
# only when packages are wanted:
#   - by hand;
#   - for a version tag (v*).
# Pushes and pull requests get the same build, check and start, without keeping the package, from the
# per-platform build workflows (build-<rid>.yml); all of them share platform-package.yml. Nothing is
# released or published: packages are kept as workflow artifacts for 7 days. Nothing is signed beyond
# macOS's free ad-hoc signature (docs/releasing.md).
on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        # Every package is built and started on a hosted runner of its own operating system and processor,
        # so the courtesy builds get the same automated startup check as Windows x64 without anyone owning
        # that hardware. These runners are free for public repositories; for a private one they use
        # Actions minutes (macOS at a higher rate).
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    uses: ./.github/workflows/platform-package.yml
    with:
      runner: ${{ matrix.os }}
      rid: ${{ matrix.rid }}
      keep-package: true
